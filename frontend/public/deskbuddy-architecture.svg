<svg width="1600" height="980" viewBox="0 0 1600 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="980" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F9FC"/>
      <stop offset="1" stop-color="#EEF4FF"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E7F0FF"/>
      <stop offset="1" stop-color="#D7E8FF"/>
    </linearGradient>
    <linearGradient id="greenCard" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E9F9F0"/>
      <stop offset="1" stop-color="#D8F2E3"/>
    </linearGradient>
    <linearGradient id="orangeCard" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFF1E3"/>
      <stop offset="1" stop-color="#FFE4C8"/>
    </linearGradient>
    <linearGradient id="purpleCard" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F3EEFF"/>
      <stop offset="1" stop-color="#E6DDFF"/>
    </linearGradient>
    <linearGradient id="darkCard" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1F365C"/>
      <stop offset="1" stop-color="#10233F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1E355B" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12V0Z" fill="#2F6FE4"/>
    </marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12V0Z" fill="#0E8C82"/>
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12V0Z" fill="#D97706"/>
    </marker>
    <style>
      .title { font: 700 38px 'Segoe UI', Arial, sans-serif; fill: #10233F; }
      .subtitle { font: 500 18px 'Segoe UI', Arial, sans-serif; fill: #516079; }
      .section { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #4D5B73; letter-spacing: 1.4px; }
      .cardTitle { font: 700 26px 'Segoe UI', Arial, sans-serif; fill: #10233F; }
      .cardBody { font: 500 18px 'Segoe UI', Arial, sans-serif; fill: #30435F; }
      .small { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #5A6A84; }
      .darkTitle { font: 700 26px 'Segoe UI', Arial, sans-serif; fill: #FFFFFF; }
      .darkBody { font: 500 18px 'Segoe UI', Arial, sans-serif; fill: #D8E4FF; }
      .chip { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #FFFFFF; }
      .footer { font: 500 16px 'Segoe UI', Arial, sans-serif; fill: #627089; }
    </style>
  </defs>

  <rect width="1600" height="980" rx="30" fill="url(#bg)"/>

  <text x="84" y="82" class="title">DeskBuddy System Architecture</text>
  <text x="84" y="114" class="subtitle">Multimodal desk monitoring with ESP32 serial sensing, webcam posture scoring, audio noise analysis, FastAPI services, Postgres storage, and a React dashboard.</text>

  <text x="84" y="168" class="section">INPUT SOURCES</text>
  <text x="472" y="168" class="section">PROCESSING LAYER</text>
  <text x="940" y="168" class="section">BACKEND SERVICES</text>
  <text x="1264" y="168" class="section">OUTPUTS</text>

  <g filter="url(#shadow)">
    <rect x="84" y="200" width="300" height="182" rx="26" fill="url(#greenCard)"/>
    <text x="116" y="246" class="cardTitle">ESP32 Desk Sensor</text>
    <text x="116" y="284" class="cardBody">USB serial JSON stream</text>
    <text x="116" y="316" class="cardBody">• distance_cm</text>
    <text x="116" y="346" class="cardBody">• temp_c</text>
    <text x="116" y="376" class="cardBody">• hum_pct</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="84" y="420" width="300" height="182" rx="26" fill="url(#orangeCard)"/>
    <text x="116" y="466" class="cardTitle">Webcam Feed</text>
    <text x="116" y="504" class="cardBody">Low-FPS pose capture</text>
    <text x="116" y="536" class="cardBody">MediaPipe landmarks</text>
    <text x="116" y="568" class="cardBody">No image storage</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="84" y="640" width="300" height="182" rx="26" fill="url(#purpleCard)"/>
    <text x="116" y="686" class="cardTitle">Microphone Input</text>
    <text x="116" y="724" class="cardBody">sounddevice stream</text>
    <text x="116" y="756" class="cardBody">RMS + calibrated dB</text>
    <text x="116" y="788" class="cardBody">Noise smoothing window</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="472" y="200" width="360" height="240" rx="26" fill="url(#blueCard)"/>
    <text x="504" y="246" class="cardTitle">Serial Reader + Posture Tracker</text>
    <text x="504" y="284" class="cardBody">Auto-detect ESP32 port</text>
    <text x="504" y="316" class="cardBody">Parse serial JSON packets</text>
    <text x="504" y="348" class="cardBody">5-sample smoothing</text>
    <text x="504" y="380" class="cardBody">Hysteresis + min-duration gating</text>
    <text x="504" y="412" class="cardBody">Classify sitting / standing</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="472" y="478" width="360" height="238" rx="26" fill="url(#orangeCard)"/>
    <text x="504" y="524" class="cardTitle">Webcam Slouch Worker</text>
    <text x="504" y="562" class="cardBody">MediaPipe Pose landmarks</text>
    <text x="504" y="594" class="cardBody">Extract head, neck, shoulder features</text>
    <text x="504" y="626" class="cardBody">Baseline calibration + tolerances</text>
    <text x="504" y="658" class="cardBody">Score posture: good / warning / slouching</text>
    <text x="504" y="690" class="cardBody">Emit sustained slouch events</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="472" y="754" width="360" height="156" rx="26" fill="url(#purpleCard)"/>
    <text x="504" y="800" class="cardTitle">Audio Worker</text>
    <text x="504" y="838" class="cardBody">Capture audio blocks</text>
    <text x="504" y="870" class="cardBody">Compute RMS, dB, smoothed dB</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="940" y="200" width="262" height="306" rx="26" fill="url(#darkCard)"/>
    <text x="972" y="246" class="darkTitle">FastAPI App</text>
    <text x="972" y="286" class="darkBody">• `/serial/*`</text>
    <text x="972" y="318" class="darkBody">• `/readings/*`</text>
    <text x="972" y="350" class="darkBody">• `/settings/*`</text>
    <text x="972" y="382" class="darkBody">• `/health`</text>
    <text x="972" y="424" class="darkBody">Coordinates worker callbacks</text>
    <text x="972" y="456" class="darkBody">Persists readings</text>
    <text x="972" y="488" class="darkBody">Broadcasts live updates</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="940" y="546" width="262" height="182" rx="26" fill="url(#blueCard)"/>
    <text x="972" y="592" class="cardTitle">WebSocket Stream</text>
    <text x="972" y="630" class="cardBody">Live sensor updates</text>
    <text x="972" y="662" class="cardBody">Webcam posture events</text>
    <text x="972" y="694" class="cardBody">Realtime dashboard refresh</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="940" y="768" width="262" height="142" rx="26" fill="url(#greenCard)"/>
    <text x="972" y="814" class="cardTitle">Postgres</text>
    <text x="972" y="852" class="cardBody">Readings</text>
    <text x="972" y="884" class="cardBody">Posture events + calibration</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1264" y="200" width="252" height="272" rx="26" fill="url(#blueCard)"/>
    <text x="1296" y="246" class="cardTitle">React Frontend</text>
    <text x="1296" y="284" class="cardBody">Dashboard</text>
    <text x="1296" y="316" class="cardBody">History charts</text>
    <text x="1296" y="348" class="cardBody">Settings + calibration</text>
    <text x="1296" y="380" class="cardBody">Webcam preview controls</text>
    <text x="1296" y="412" class="cardBody">Live status indicators</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1264" y="510" width="252" height="180" rx="26" fill="url(#orangeCard)"/>
    <text x="1296" y="556" class="cardTitle">User Insights</text>
    <text x="1296" y="594" class="cardBody">Current posture state</text>
    <text x="1296" y="626" class="cardBody">Slouch trend + confidence</text>
    <text x="1296" y="658" class="cardBody">Noise level classification</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1264" y="728" width="252" height="182" rx="26" fill="url(#greenCard)"/>
    <text x="1296" y="774" class="cardTitle">Poster Highlights</text>
    <text x="1296" y="812" class="cardBody">Original architecture graphic</text>
    <text x="1296" y="844" class="cardBody">Clear data flow</text>
    <text x="1296" y="876" class="cardBody">Multimodal sensing story</text>
  </g>

  <path d="M384 291H452" stroke="#0E8C82" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowTeal)"/>
  <path d="M384 511H452" stroke="#D97706" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowOrange)"/>
  <path d="M384 731H452" stroke="#6D5BD0" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowBlue)"/>

  <path d="M832 320H918" stroke="#2F6FE4" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <path d="M832 598H918" stroke="#D97706" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowOrange)"/>
  <path d="M832 832H918" stroke="#0E8C82" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowTeal)"/>

  <path d="M1202 355H1242" stroke="#2F6FE4" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <path d="M1202 638H1242" stroke="#2F6FE4" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowBlue)"/>

  <path d="M1072 728V746" stroke="#2F6FE4" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <path d="M1202 840C1270 840 1280 840 1280 840" stroke="#0E8C82" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowTeal)"/>

  <path d="M1202 838C1238 838 1242 836 1264 818" stroke="#0E8C82" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 10" marker-end="url(#arrowTeal)"/>
  <path d="M1070 506V536" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 10" marker-end="url(#arrowBlue)"/>
  <path d="M1090 768V730" stroke="#0E8C82" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 10" marker-end="url(#arrowTeal)"/>

  <rect x="1024" y="120" width="118" height="32" rx="16" fill="#2F6FE4"/>
  <text x="1048" y="141" class="chip">Realtime path</text>

  <rect x="1160" y="120" width="118" height="32" rx="16" fill="#0E8C82"/>
  <text x="1189" y="141" class="chip">Stored data</text>

  <rect x="1296" y="120" width="132" height="32" rx="16" fill="#D97706"/>
  <text x="1319" y="141" class="chip">Computer vision</text>

  <text x="84" y="948" class="footer">Website usage: place this file in your public assets and embed it with an image tag, or open it directly and export it as a poster figure.</text>
</svg>
